<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Somax | Admin horarios</title>
    <link rel="icon" type="image/png" href="/img/favicon.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    /><link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div class="dashboard-shell">
      <aside class="sidebar">
        <div class="mb-4">
          <img
            id="somax-logo"
            src="/img/logo-blanco-sin-bg.png"
            alt="Somax"
            height="40"
          />
          <small class="text-muted d-block mt-2">Panel admin</small>
        </div>
        <a href="/admin">Dashboard</a>
        <a href="/admin/usuarios">Usuarios</a>
        <a href="/admin/clases">Clases</a>
        <a class="active" href="/admin/horarios">Horarios</a>
        <a href="/admin/reportes">Reportes</a>
        <a href="/dashboard">Volver al panel</a>
        <a href="#" onclick="logout()">Cerrar sesión</a>
      </aside>
      <main class="main-panel">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h2>Horarios</h2>
          <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar tema"></button>
        </div>

        <section class="mb-5">
          <div class="section-title mb-3">
            <span></span>
            <h4 class="mb-0">Programar horario</h4>
          </div>
          <div class="glass-card">
            <form id="scheduleForm" class="row g-3">
              <div class="col-md-4">
                <label class="form-label">Clase</label>
                <select
                  class="form-select"
                  id="scheduleClase"
                  required
                ></select>
              </div>
              <div class="col-md-4">
                <label class="form-label">Monitor</label>
                <select class="form-select" id="scheduleMonitor"></select>
              </div>
              <div class="col-md-4">
                <label class="form-label">Fecha y hora</label>
                <input
                  type="datetime-local"
                  class="form-control"
                  name="fecha"
                  required
                />
              </div>
              <div class="col-md-4">
                <label class="form-label">Duracion (min)</label>
                <input
                  type="number"
                  class="form-control"
                  name="duracion"
                  min="30"
                  value="60"
                  required
                />
              </div>
              <div class="col-md-4">
                <label class="form-label">Aforo del horario</label>
                <input
                  type="number"
                  class="form-control"
                  name="aforo"
                  min="1"
                  placeholder="(Opcional)"
                />
                <div class="form-text">
                  No puede superar el aforo de la clase.
                </div>
              </div>
              <div class="col-md-4">
                <label class="form-label">Sala</label>
                <input class="form-control" name="sala" required />
              </div>
              <div class="col-md-4 d-flex align-items-end">
                <button class="btn btn-accent w-100" type="submit">
                  Guardar horario
                </button>
              </div>
              <div class="col-12">
                <div class="text-info" id="scheduleFormMessage"></div>
              </div>
            </form>
          </div>
        </section>

        <section class="mb-5">
          <div class="section-title mb-3">
            <span></span>
            <h4 class="mb-0">Horarios existentes</h4>
          </div>
          <div class="glass-card">
            <div class="table-responsive">
              <table class="table table-dark table-borderless align-middle mb-0">
                <thead>
                  <tr>
                    <th>Clase</th>
                    <th>Inicio</th>
                    <th>Sala</th>
                    <th>Monitor</th>
                    <th>Duración</th>
                    <th>Aforo</th>
                    <th>Acción</th>
                  </tr>
                </thead>
                <tbody id="scheduleListAdmin"></tbody>
              </table>
            </div>
          </div>
        </section>
    </main>
    </div>
    <script src="/js/app.js"></script>
    <script src="/js/admin.js"></script>
    <script src="/js/theme.js"></script>
  </body>
</html>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Somax | Registro</title>
    <link rel="icon" type="image/png" href="/img/favicon.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body class="page-shell">
    <div class="page-content">
      <nav class="navbar navbar-expand-lg">
        <div class="container">
          <a class="navbar-brand" href="/">
            <img
              id="somax-logo"
              src="/img/logo-blanco-sin-bg.png"
              alt="Somax"
              height="36"
            />
          </a>
          <div class="d-flex gap-2">
            <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar tema"></button>
          </div>
        </div>
      </nav>
      <main class="auth-main">
        <div class="container">
          <div class="row justify-content-center">
            <div class="col-lg-6">
              <div class="glass-card">
                <h3 class="mb-3">Crea tu cuenta Somax</h3>
                <p class="text-muted">
                  Tu cuenta quedará inactiva hasta validación manual del
                  administrador.
                </p>
                <form id="registerForm">
                  <div class="mb-3">
                    <label class="form-label">Nombre completo</label>
                    <input
                      type="text"
                      class="form-control"
                      name="nombre"
                      minlength="3"
                      maxlength="80"
                      required
                    />
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" name="email" required />
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Teléfono</label>
                    <input
                      type="tel"
                      class="form-control"
                      name="telefono"
                      pattern="\\+?[0-9]{9,15}"
                      inputmode="tel"
                    />
                    <div class="form-text">Ejemplo: +34600111222</div>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <div class="input-group">
                      <input
                        id="registerPassword"
                        type="password"
                        class="form-control"
                        name="password"
                        minlength="8"
                        maxlength="100"
                        autocomplete="new-password"
                        required
                      />
                      <button
                        class="btn btn-outline-light"
                        type="button"
                        data-password-toggle="registerPassword"
                        aria-label="Mostrar contraseña"
                      >
                        <i class="fa-regular fa-eye"></i>
                      </button>
                    </div>
                    <div class="form-text">
                      Usa mayúscula, minúscula, número y símbolo.
                    </div>
                  </div>
                  <div class="text-info mb-3" id="registerMessage"></div>
                  <button class="btn btn-accent w-100" type="submit">
                    Registrarme
                  </button>
                </form>
                <div class="mt-3 text-center">
                  <a href="/login" class="text-muted">Ya tengo cuenta</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="/js/app.js"></script>
    <script src="/js/register.js"></script>
    <script src="/js/password-toggle.js"></script>
    <script src="/js/theme.js"></script>
  </body>
</html>

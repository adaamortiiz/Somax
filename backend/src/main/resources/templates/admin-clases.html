<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Somax | Admin clases</title>
    <link rel="icon" type="image/png" href="/img/favicon.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    /><link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div class="dashboard-shell">
      <aside class="sidebar">
        <div class="mb-4">
          <img
            id="somax-logo"
            src="/img/logo-blanco-sin-bg.png"
            alt="Somax"
            height="40"
          />
          <small class="text-muted d-block mt-2">Panel admin</small>
        </div>
        <a href="/admin">Dashboard</a>
        <a href="/admin/usuarios">Usuarios</a>
        <a class="active" href="/admin/clases">Clases</a>
        <a href="/admin/horarios">Horarios</a>
        <a href="/admin/reportes">Reportes</a>
        <a href="/dashboard">Volver al panel</a>
        <a href="#" onclick="logout()">Cerrar sesión</a>
      </aside>
      <div class="sidebar-backdrop" aria-hidden="true"></div>
      <main class="main-panel">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="d-flex align-items-center gap-2">
            <button
              class="mobile-nav-toggle"
              type="button"
              data-sidebar-toggle
              aria-label="Abrir menú"
            >
              <i class="fa-solid fa-bars"></i>
            </button>
            <h2 class="mb-0">Clases</h2>
          </div>
          <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar tema"></button>
        </div>

        <section class="mb-5">
          <div class="section-title mb-3">
            <span></span>
            <h4 class="mb-0">Nueva clase</h4>
          </div>
          <div class="glass-card">
            <form id="classForm" class="row g-3">
              <div class="col-md-4">
                <label class="form-label">Nombre</label>
                <input class="form-control" name="nombre" required />
              </div>
              <div class="col-md-4">
                <label class="form-label">Nivel</label>
                <select class="form-select" name="nivel">
                  <option value="BASICO">Basico</option>
                  <option value="INTERMEDIO">Intermedio</option>
                  <option value="AVANZADO">Avanzado</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label">Aforo maximo</label>
                <input
                  type="number"
                  class="form-control"
                  name="aforo"
                  min="1"
                  required
                />
              </div>
              <div class="col-12">
                <label class="form-label">Descripcion</label>
                <textarea
                  class="form-control"
                  name="descripcion"
                  rows="2"
                  required
                ></textarea>
              </div>
              <div class="col-md-6">
                <label class="form-label">Imagen URL</label>
                <input class="form-control" name="imagenUrl" />
              </div>
              <div class="col-md-3 d-flex align-items-end">
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    name="privada"
                  />
                  <label class="form-check-label">Privada</label>
                </div>
              </div>
              <div class="col-md-3 d-flex align-items-end">
                <button class="btn btn-accent w-100" type="submit">
                  Guardar clase
                </button>
              </div>
              <div class="col-12">
                <div class="text-info" id="classFormMessage"></div>
              </div>
            </form>
          </div>
        </section>

        <section class="mb-5">
          <div class="section-title mb-3">
            <span></span>
            <h4 class="mb-0">Clases existentes</h4>
          </div>
          <div class="glass-card">
            <div class="table-responsive">
              <table class="table table-dark table-borderless align-middle mb-0">
                <thead>
                  <tr>
                    <th>Nombre</th>
                    <th>Nivel</th>
                    <th>Aforo</th>
                    <th>Privada</th>
                    <th>Imagen</th>
                    <th>Descripción</th>
                    <th>Acción</th>
                  </tr>
                </thead>
                <tbody id="classListAdmin"></tbody>
              </table>
            </div>
          </div>
        </section>
    </main>
    </div>
    <script src="/js/app.js"></script>
    <script src="/js/admin.js"></script>
    <script src="/js/theme.js"></script>
  </body>
</html>

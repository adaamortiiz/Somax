<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Somax | Panel monitor</title>
    <link rel="icon" type="image/png" href="/img/favicon.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css"
    />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div class="dashboard-shell">
      <aside class="sidebar">
        <div class="mb-4">
          <img
            id="somax-logo"
            src="/img/logo-blanco-sin-bg.png"
            alt="Somax"
            height="40"
          />
          <small class="text-muted d-block mt-2">Panel privado</small>
        </div>
        <a class="active" href="/staff/horarios">Panel monitor</a>
        <a href="#" onclick="logout()">Cerrar sesión</a>
      </aside>
      <div class="sidebar-backdrop" aria-hidden="true"></div>
      <main class="main-panel">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <div class="d-flex align-items-center gap-2">
              <button
                class="mobile-nav-toggle"
                type="button"
                data-sidebar-toggle
                aria-label="Abrir menú"
              >
                <i class="fa-solid fa-bars"></i>
              </button>
              <h2 class="mb-1">Hola, <span id="userName">Monitor</span></h2>
            </div>
          </div>
          <div>
            <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar tema"></button>
          </div>
        </div>

        <section class="mb-4">
          <div class="section-title mb-3">
            <span></span>
            <h3 class="mb-0">Mi calendario</h3>
          </div>
          <div class="calendar-card">
            <div id="staffCalendar"></div>
          </div>
        </section>

        <div class="row g-4">
          <div class="col-lg-7">
            <section class="mb-4">
              <div class="section-title mb-3">
                <span></span>
                <h3 class="mb-0">Horarios asignados</h3>
              </div>
              <div class="calendar-card">
                <div id="staffScheduleList"></div>
              </div>
            </section>
          </div>
          <div class="col-lg-5">
            <section class="mb-4">
              <div class="section-title mb-3">
                <span></span>
                <h3 class="mb-0">Asistencia</h3>
              </div>
              <div class="glass-card" id="staffAttendanceList">
                <p class="text-muted mb-0">
                  Selecciona un horario para ver la asistencia.
                </p>
              </div>
            </section>
          </div>
        </div>
    </main>
    </div>
    <script src="/js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
    <script src="/js/staff-calendar.js"></script>
    <script src="/js/theme.js"></script>
  </body>
</html>

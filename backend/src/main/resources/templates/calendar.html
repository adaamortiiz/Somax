<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Somax | Calendario</title>
    <link rel="icon" type="image/png" href="/img/favicon.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css"
    />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div class="dashboard-shell">
      <aside class="sidebar">
        <div class="mb-4">
          <img
            id="somax-logo"
            src="/img/logo-blanco-sin-bg.png"
            alt="Somax"
            height="40"
          />
          <small class="text-muted d-block mt-2">Panel privado</small>
        </div>
        <a href="/dashboard">Resumen</a>
        <a class="active" href="/app/calendar">Calendario</a>
        <a href="/app/reservas">Mis reservas</a>
        <a href="/app/clases">Clases</a>
        <a href="/app/chat">Asistente IA</a>
        <a href="/app/notificaciones">Notificaciones</a>
        <a id="staffLink" class="d-none" href="/staff/horarios"
          >Panel monitor</a
        >
        <a id="adminLink" class="d-none" href="/admin">Administración</a>
        <a href="#" onclick="logout()">Cerrar sesión</a>
      </aside>
      <div class="sidebar-backdrop" aria-hidden="true"></div>
      <main class="main-panel">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <div class="d-flex align-items-center gap-2">
              <button
                class="mobile-nav-toggle"
                type="button"
                data-sidebar-toggle
                aria-label="Abrir menú"
              >
                <i class="fa-solid fa-bars"></i>
              </button>
              <h2 class="mb-1">Hola, <span id="userName">Socio</span></h2>
            </div>
          </div>
          <div>
            <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar tema"></button>
          </div>
        </div>

        <section class="mb-5">
          <div class="section-title mb-3">
            <span></span>
            <h3 class="mb-0">Calendario de clases</h3>
          </div>
          <div class="calendar-card">
            <div class="d-flex flex-wrap gap-3 mb-3 small text-muted">
              <span><i class="fa-solid fa-circle me-1 text-success"></i>Disponible</span>
              <span><i class="fa-solid fa-circle me-1 text-warning"></i>Pocas plazas</span>
              <span><i class="fa-solid fa-circle me-1 text-danger"></i>Completo</span>
              <span><i class="fa-solid fa-circle me-1 text-info"></i>Mi reserva</span>
            </div>
            <div id="classCalendar"></div>
          </div>
        </section>
    </main>
    </div>
    <script src="/js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
    <script src="/js/calendar.js"></script>
    <script src="/js/theme.js"></script>
  </body>
</html>

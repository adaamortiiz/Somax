<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Somax | Admin usuarios</title>
    <link rel="icon" type="image/png" href="/img/favicon.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    /><link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div class="dashboard-shell">
      <aside class="sidebar">
        <div class="mb-4">
          <img
            id="somax-logo"
            src="/img/logo-blanco-sin-bg.png"
            alt="Somax"
            height="40"
          />
          <small class="text-muted d-block mt-2">Panel admin</small>
        </div>
        <a href="/admin">Dashboard</a>
        <a class="active" href="/admin/usuarios">Usuarios</a>
        <a href="/admin/clases">Clases</a>
        <a href="/admin/horarios">Horarios</a>
        <a href="/admin/reportes">Reportes</a>
        <a href="/dashboard">Volver al panel</a>
        <a href="#" onclick="logout()">Cerrar sesión</a>
      </aside>
      <main class="main-panel">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h2>Usuarios</h2>
          <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar tema"></button>
        </div>

        <section class="mb-5">
          <div class="section-title mb-3">
            <span></span>
            <h4 class="mb-0">Gestion de usuarios</h4>
          </div>
          <div class="glass-card">
            <div class="table-responsive">
              <table class="table table-dark table-borderless align-middle">
                <thead>
                  <tr>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Teléfono</th>
                    <th>Rol</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                  </tr>
                </thead>
                <tbody id="usersTable"></tbody>
              </table>
            </div>
          </div>
        </section>
    </main>
    </div>
    <script src="/js/app.js"></script>
    <script src="/js/admin.js"></script>
    <script src="/js/theme.js"></script>
  </body>
</html>

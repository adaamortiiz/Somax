<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Somax | Acceso</title>
    <link rel="icon" type="image/png" href="/img/favicon.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body class="page-shell">
    <div class="page-content">
      <nav class="navbar navbar-expand-lg">
        <div class="container">
          <a class="navbar-brand" href="/">
            <img
              id="somax-logo"
              src="/img/logo-blanco-sin-bg.png"
              alt="Somax"
              height="36"
            />
          </a>
          <div class="d-flex gap-2">
            <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar tema"></button>
          </div>
        </div>
      </div>
      </nav>
      <main class="auth-main">
        <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-5">
            <div class="glass-card">
              <h3 class="mb-3">Acceso a Somax</h3>
              <p class="text-muted">
                Introduce tus credenciales para acceder a tu panel.
              </p>
              <form id="loginForm">
                <div class="mb-3">
                  <label class="form-label">Email</label>
                  <input type="email" class="form-control" name="email" required />
                </div>
              <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <div class="input-group">
                  <input
                    id="loginPassword"
                    type="password"
                    class="form-control"
                    name="password"
                    minlength="8"
                    maxlength="100"
                    required
                  />
                  <button
                    class="btn btn-outline-light"
                    type="button"
                    data-password-toggle="loginPassword"
                    aria-label="Mostrar contraseña"
                  >
                    <i class="fa-regular fa-eye"></i>
                  </button>
                </div>
              </div>
                <div class="text-danger mb-3" id="loginError"></div>
                <button class="btn btn-accent w-100" type="submit">
                  Entrar
                </button>
              </form>
              <div class="d-flex justify-content-between mt-3">
                <a href="/registro" class="text-muted">Crear cuenta</a>
                <a href="/forgot-password" class="text-muted"
                  >Recuperar contraseña</a
                >
              </div>
            </div>
          </div>
        </div>
      </div>
        </div>
      </main>
    </div>

    <script src="/js/app.js"></script>
    <script src="/js/login.js"></script>
    <script src="/js/password-toggle.js"></script>
    <script src="/js/theme.js"></script>
  </body>
</html>

spring.application.name=Somax

spring.datasource.url=jdbc:h2:file:./data/somaxdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.thymeleaf.encoding=UTF-8
spring.messages.encoding=UTF-8

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=${PORT:8080}

app.jwt.secret=SomaxDevSecretKey_ChangeMe_32chars_min
app.jwt.expiration-minutes=180

app.stackai.base-url=https://api.stack-ai.com
app.stackai.api-key=CHANGE_ME_STACKAI_KEY
app.stackai.workflow-id=CHANGE_ME_WORKFLOW_ID

app.sendgrid.api-key=${APP_SENDGRID_API_KEY:CHANGE_ME_SENDGRID_KEY}
app.sendgrid.from-email=${APP_SENDGRID_FROM_EMAIL:no-reply@somax.local}
app.sendgrid.from-name=${APP_SENDGRID_FROM_NAME:Somax}

app.cloudinary.cloud-name=CHANGE_ME_CLOUD_NAME
app.cloudinary.api-key=CHANGE_ME_CLOUDINARY_KEY
app.cloudinary.api-secret=CHANGE_ME_CLOUDINARY_SECRET

app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:${PORT:8080}}

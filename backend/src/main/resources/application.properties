spring.application.name=Somax

spring.datasource.url=jdbc:h2:file:./data/somaxdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.thymeleaf.encoding=UTF-8
spring.messages.encoding=UTF-8

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=${PORT:8080}

app.jwt.secret=SomaxDevSecretKey_ChangeMe_32chars_min
app.jwt.expiration-minutes=180

app.stackai.base-url=https://api.stack-ai.com
app.stackai.api-key=CHANGE_ME_STACKAI_KEY
app.stackai.workflow-id=CHANGE_ME_WORKFLOW_ID

spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT:10000}
spring.mail.properties.mail.smtp.timeout=${SMTP_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT:10000}

app.mail.from-email=${MAIL_FROM_EMAIL:no-reply@somax.local}
app.mail.from-name=${MAIL_FROM_NAME:Somax}

# Resend (recommended for Render). When RESEND_API_KEY is set, email is sent via HTTPS.
app.mail.resend.api-key=${RESEND_API_KEY:}
app.mail.resend.from=${RESEND_FROM:}

app.cloudinary.cloud-name=CHANGE_ME_CLOUD_NAME
app.cloudinary.api-key=CHANGE_ME_CLOUDINARY_KEY
app.cloudinary.api-secret=CHANGE_ME_CLOUDINARY_SECRET

app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:${PORT:8080}}

# Demo behavior: keep notifications panel empty on each start
app.demo.clear-notifications=true

# Export H2 to readable SQL file (keeps mv.db binary as-is)
app.db.export-sql=true
app.db.export-sql-path=./data/somaxdb.sql
